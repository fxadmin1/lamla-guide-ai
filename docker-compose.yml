version: "3.8"

services:
  # 1. Python AI Engine (FastAPI + Gunicorn multi-worker ASGI)
  python-ai:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: lamla-python-ai
    restart: unless-stopped
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PYTHON_AI_PROVIDER_MODE=free_configured
    volumes:
      - py_cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lamla-net

  # 2. Next.js Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: lamla-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PYTHON_AI_URL=http://python-ai:8000
      - NEXT_PUBLIC_ADMIN_WHATSAPP_NUMBER=${NEXT_PUBLIC_ADMIN_WHATSAPP_NUMBER:-233539337142}
      - NEXT_PUBLIC_ADMIN_WHATSAPP_DISPLAY=${NEXT_PUBLIC_ADMIN_WHATSAPP_DISPLAY:-0539337142}
    depends_on:
      python-ai:
        condition: service_healthy
    networks:
      - lamla-net

  # 3. High-Performance Nginx Reverse Proxy (Handles 1GB uploads & 1M student concurrency)
  nginx:
    image: nginx:alpine
    container_name: lamla-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - python-ai
    networks:
      - lamla-net

volumes:
  py_cache:

networks:
  lamla-net:
    driver: bridge
