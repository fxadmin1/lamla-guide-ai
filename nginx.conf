events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Support large file uploads up to 1 GB without NGINX 413 error
    client_max_body_size 1024M;
    client_body_buffer_size 128k;

    # Gzip compression for high-speed transmission
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream services
    upstream nextjs_upstream {
        server web:3000;
        keepalive 32;
    }

    upstream python_upstream {
        server python-ai:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Large file timeouts (5 minutes for heavy textbook processing)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Disable buffering for real-time file upload streaming
        proxy_buffering off;
        proxy_request_buffering off;

        # Direct Python AI Engine proxy for internal AI calls
        location /py-api/ {
            rewrite ^/py-api/(.*) /$1 break;
            proxy_pass http://python_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js Application
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
