<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Background (Rounded squircle for modern OS homescreens) -->
  <rect width="512" height="512" rx="112" fill="url(#gradBg)"/>

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Background Ambient Glow behind icon -->
  <circle cx="256" cy="240" r="140" fill="#38bdf8" opacity="0.18" filter="url(#glow)"/>

  <!-- Mortarboard Cap (Graduation Cap) -->
  <!-- Cap Rhombus Top -->
  <polygon points="256,128 416,198 256,268 96,198" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Inner Cap Diamond Accent -->
  <polygon points="256,156 376,202 256,248 136,202" fill="#eff6ff" opacity="0.9"/>

  <!-- Skullcap Bottom Arc -->
  <path d="M 160 228 L 160 286 C 160 336 352 336 352 286 L 352 228" fill="#ffffff" opacity="0.95"/>
  <path d="M 184 286 C 184 322 328 322 328 286" fill="url(#gradBg)" opacity="0.4"/>

  <!-- Cap Tassel Band & Cord -->
  <path d="M 256 198 Q 380 205 384 270 L 380 340" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Tassel Bobble -->
  <circle cx="380" cy="342" r="10" fill="#f59e0b"/>
  <!-- Tassel Fringe -->
  <path d="M 374 350 L 372 388 M 380 350 L 380 392 M 386 350 L 388 388" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

  <!-- Central AI Sparkle Star (Intelligence) -->
  <path d="M 256,330 Q 256,370 296,370 Q 256,370 256,410 Q 256,370 216,370 Q 256,370 256,330 Z" fill="url(#goldGrad)"/>
  <circle cx="256" cy="370" r="6" fill="#ffffff"/>

  <!-- Mini Star Left -->
  <path d="M 130,135 Q 130,150 145,150 Q 130,150 130,165 Q 130,150 115,150 Q 130,150 130,135 Z" fill="#67e8f9" opacity="0.85"/>

  <!-- Mini Star Right -->
  <path d="M 390,120 Q 390,135 405,135 Q 390,135 390,150 Q 390,135 375,135 Q 390,135 390,120 Z" fill="#67e8f9" opacity="0.85"/>
</svg>