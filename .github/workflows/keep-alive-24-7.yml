name: LAMLA Guide AI — 24/7 Uninterrupted Uptime Keep-Alive

on:
  schedule:
    # Runs every 10 minutes, 24 hours a day, 7 days a week
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping LAMLA Guide AI Unified Health Endpoint
        env:
          TARGET_URL: ${{ vars.PUBLIC_APP_URL || 'https://lamlaguide.onrender.com' }}
        run: |
          echo "Pinging ${TARGET_URL}/health to guarantee 24/7 uninterrupted uptime..."
          curl -fsSL --retry 2 --max-time 25 "${TARGET_URL}/health" || true
          curl -fsSL --retry 1 --max-time 15 "https://lamla-guide-ai.onrender.com/health" || true
          echo ""
          echo "Keep-alive ping completed."
